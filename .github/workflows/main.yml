name: Deploy to Amazon ECS

on:
  push:
    branches: 
      - main
    paths-ignore:
      - 'README.md'

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 
        uses: actions/checkout@v3

      - name: Lint Code
        run: echo "Linting repository"
      
      - name: Run unit tests
        run: echo "Running unit tests"

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: install utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          IMAGE_URI=390844744852.dkr.ecr.us-east-1.amazonaws.com/networksecurity:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
  
  Continuous-deployment:
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull latest images
        run: |
          IMAGE="${{ needs.build-and-push-ecr-image.outputs.image }}"
          if [ -z "$IMAGE" ]; then
            IMAGE="390844744852.dkr.ecr.us-east-1.amazonaws.com/networksecurity:latest"
          fi
          echo "Pulling image: $IMAGE"
          docker pull $IMAGE
      
      - name: Stop and remove old container
        run: |
          docker stop networksecurity || true
          docker rm networksecurity || true

      - name: Run docker image to serve users
        run: |
          IMAGE="${{ needs.build-and-push-ecr-image.outputs.image }}"
          if [ -z "$IMAGE" ]; then
            IMAGE="390844744852.dkr.ecr.us-east-1.amazonaws.com/networksecurity:latest"
          fi
          docker run -d -p 8080:8000 --name=networksecurity \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_REGION=us-east-1 \
            -e MONGO_DB_URL=${{ secrets.MONGO_DB_URL }} \
            $IMAGE
      
      - name: clean previous images and containers
        run: |
          docker system prune -f